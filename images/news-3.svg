<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220">
  <!-- News 3: Platform / architecture design -->
  <defs>
    <linearGradient id="n3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0050"/>
      <stop offset="100%" stop-color="#003d8f"/>
    </linearGradient>
  </defs>
  <rect width="420" height="220" rx="8" fill="url(#n3bg)"/>
  <!-- Grid background -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="420" y2="40"/>
    <line x1="0" y1="80" x2="420" y2="80"/>
    <line x1="0" y1="120" x2="420" y2="120"/>
    <line x1="0" y1="160" x2="420" y2="160"/>
    <line x1="70" y1="0" x2="70" y2="220"/>
    <line x1="140" y1="0" x2="140" y2="220"/>
    <line x1="210" y1="0" x2="210" y2="220"/>
    <line x1="280" y1="0" x2="280" y2="220"/>
    <line x1="350" y1="0" x2="350" y2="220"/>
  </g>
  <!-- Architecture boxes (layered) -->
  <!-- Top layer: Users -->
  <rect x="160" y="25" width="100" height="28" rx="5" fill="rgba(0,166,156,0.4)" stroke="#00a69c" stroke-width="1.5"/>
  <text x="210" y="43" text-anchor="middle" font-family="Arial" font-size="9.5" fill="white">👤 Usuarios</text>
  <!-- Middle layer: Platform -->
  <rect x="60" y="80" width="300" height="28" rx="5" fill="rgba(0,61,143,0.7)" stroke="rgba(0,166,156,0.6)" stroke-width="1.5"/>
  <text x="210" y="98" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="white">🖥️ Plataforma SIM4UE (Web/Mobile)</text>
  <!-- Lower layer: Modules -->
  <rect x="30" y="135" width="80" height="28" rx="5" fill="rgba(244,160,28,0.3)" stroke="#f4a01c" stroke-width="1"/>
  <text x="70" y="153" text-anchor="middle" font-family="Arial" font-size="8.5" fill="white">🥽 VR/AR</text>
  <rect x="125" y="135" width="80" height="28" rx="5" fill="rgba(244,160,28,0.3)" stroke="#f4a01c" stroke-width="1"/>
  <text x="165" y="153" text-anchor="middle" font-family="Arial" font-size="8.5" fill="white">🤖 IA</text>
  <rect x="220" y="135" width="80" height="28" rx="5" fill="rgba(244,160,28,0.3)" stroke="#f4a01c" stroke-width="1"/>
  <text x="260" y="153" text-anchor="middle" font-family="Arial" font-size="8.5" fill="white">📊 Analytics</text>
  <rect x="315" y="135" width="75" height="28" rx="5" fill="rgba(244,160,28,0.3)" stroke="#f4a01c" stroke-width="1"/>
  <text x="352" y="153" text-anchor="middle" font-family="Arial" font-size="8.5" fill="white">📚 Contenidos</text>
  <!-- Connection lines -->
  <line x1="210" y1="53" x2="210" y2="80" stroke="rgba(0,166,156,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="108" x2="70" y2="135" stroke="rgba(244,160,28,0.4)" stroke-width="1.5"/>
  <line x1="165" y1="108" x2="165" y2="135" stroke="rgba(244,160,28,0.4)" stroke-width="1.5"/>
  <line x1="260" y1="108" x2="260" y2="135" stroke="rgba(244,160,28,0.4)" stroke-width="1.5"/>
  <line x1="352" y1="108" x2="352" y2="135" stroke="rgba(244,160,28,0.4)" stroke-width="1.5"/>
  <!-- Languages badge -->
  <rect x="30" y="178" width="75" height="22" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="67" y="193" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.7)">🇪🇸 ES · 🇵🇹 PT</text>
  <!-- Title -->
  <text x="390" y="55" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="white">ARQUITECTURA</text>
  <text x="390" y="71" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#00a69c">PEDAGÓGICA</text>
  <!-- Bottom -->
  <rect x="0" y="190" width="420" height="30" rx="0" fill="rgba(0,0,0,0.3)"/>
  <text x="20" y="209" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.5)">Actividad A1 · FPS/IAVANTE · 2026-2027</text>
  <text x="400" y="209" text-anchor="end" font-family="monospace" font-size="10" fill="rgba(244,160,28,0.8)">SIM4UE</text>
</svg>
