<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180">
  <!-- HVR - Hospital Virgen del Rocío (placeholder) -->
  <!-- Blue circle emblem -->
  <circle cx="110" cy="70" r="55" fill="#003d8f"/>
  <!-- Stylized cross (hospital) -->
  <rect x="98" y="38" width="24" height="64" rx="4" fill="white"/>
  <rect x="78" y="58" width="64" height="24" rx="4" fill="white"/>
  <!-- Small olive branch / decorative elements -->
  <ellipse cx="88" cy="50" rx="7" ry="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(-30 88 50)"/>
  <ellipse cx="132" cy="50" rx="7" ry="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(30 132 50)"/>
  <!-- HVR text -->
  <text x="110" y="146" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="20" font-weight="800" fill="#003d8f" letter-spacing="2">HVR</text>
  <text x="110" y="163" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="8.5" fill="#444">Hospital Universitario</text>
  <text x="110" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="8.5" fill="#444">Virgen del Rocío</text>
</svg>
