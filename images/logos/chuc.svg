<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160">
  <!-- CHUC - Centro Hospitalar e Universitário de Coimbra -->
  <!-- Concentric C-shaped arcs on the left -->
  <g fill="none" stroke="#1B3A6B" stroke-linecap="round">
    <!-- Outer arc (C shape, open right) -->
    <path d="M 140,20 C 60,20 20,55 20,80 C 20,105 60,140 140,140" stroke-width="14"/>
    <!-- Middle arc -->
    <path d="M 128,38 C 72,38 44,60 44,80 C 44,100 72,122 128,122" stroke-width="12"/>
    <!-- Inner arc -->
    <path d="M 116,55 C 84,55 68,66 68,80 C 68,94 84,105 116,105" stroke-width="10"/>
    <!-- Innermost arc -->
    <path d="M 104,68 C 90,68 82,73 82,80 C 82,87 90,92 104,92" stroke-width="8"/>
  </g>
  <!-- Small golden emblem circle (university crest placeholder) -->
  <circle cx="96" cy="52" r="14" fill="#C9851A" opacity="0.8"/>
  <text x="96" y="57" text-anchor="middle" font-family="serif" font-size="13" fill="white" font-weight="700">✦</text>
  <!-- CHUC text -->
  <text x="170" y="65" font-family="Arial,Helvetica,sans-serif"
        font-size="46" font-weight="800" fill="#1B3A6B" letter-spacing="-1">CHUC</text>
  <!-- Full name -->
  <text x="170" y="89" font-family="Arial,Helvetica,sans-serif"
        font-size="11.5" fill="#1B3A6B" font-weight="700">CENTRO HOSPITALAR</text>
  <text x="170" y="104" font-family="Arial,Helvetica,sans-serif"
        font-size="11.5" fill="#1B3A6B" font-weight="700">E UNIVERSITÁRIO</text>
  <text x="170" y="119" font-family="Arial,Helvetica,sans-serif"
        font-size="11.5" fill="#1B3A6B" font-weight="700">DE COIMBRA</text>
</svg>
