<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190">
  <!-- USC - Universidade de Santiago de Compostela -->
  <!-- White left panel -->
  <rect x="0" y="0" width="88" height="190" fill="#ffffff"/>
  <!-- Blue right panel -->
  <rect x="88" y="0" width="232" height="190" fill="#1B4D9B" rx="3"/>
  <!-- Thin vertical separator line -->
  <rect x="85" y="0" width="4" height="190" fill="#1B4D9B"/>
  <!-- U letter on white background -->
  <text x="6" y="168" font-family="Georgia,'Times New Roman',serif"
        font-weight="700" font-size="174" fill="#1B4D9B">U</text>
  <!-- SC letters on blue background -->
  <text x="92" y="96" font-family="Georgia,'Times New Roman',serif"
        font-weight="700" font-size="90" fill="#ffffff">SC</text>
  <!-- University full name -->
  <text x="92" y="118" font-family="Arial,Helvetica,sans-serif"
        font-size="16" fill="#ffffff" letter-spacing="0.3">UNIVERSIDADE</text>
  <text x="92" y="138" font-family="Arial,Helvetica,sans-serif"
        font-size="16" fill="#ffffff" letter-spacing="0.3">DE SANTIAGO</text>
  <text x="92" y="158" font-family="Arial,Helvetica,sans-serif"
        font-size="16" fill="#ffffff" letter-spacing="0.3">DE COMPOSTELA</text>
</svg>
