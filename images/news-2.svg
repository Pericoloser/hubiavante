<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220">
  <!-- News 2: Project launch -->
  <defs>
    <linearGradient id="n2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#00697a"/>
    </linearGradient>
  </defs>
  <rect width="420" height="220" rx="8" fill="url(#n2bg)"/>
  <!-- Star burst / launch effect -->
  <g stroke="rgba(244,160,28,0.3)" stroke-width="1" fill="none">
    <line x1="210" y1="90" x2="210" y2="30"/>
