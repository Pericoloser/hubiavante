# ============================================================
#  SIM4UE – Netlify deployment configuration
#  https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

[build]
  publish = "."
  # No build command needed – pure static site

# ── Headers ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io;"
    # Caching
    Cache-Control             = "public, max-age=3600"

# ── Asset caching ─────────────────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Redirects ────────────────────────────────────────────
# www → non-www (or vice versa, adjust as needed)
[[redirects]]
  from  = "https://sim4ue.eu/*"
  to    = "https://www.sim4ue.eu/:splat"
  status = 301
  force  = true

# Also redirect http → https (Netlify handles this automatically,
# but this explicit rule ensures no mixed content)
[[redirects]]
  from  = "http://sim4ue.eu/*"
  to    = "https://www.sim4ue.eu/:splat"
  status = 301
  force  = true

[[redirects]]
  from  = "http://www.sim4ue.eu/*"
  to    = "https://www.sim4ue.eu/:splat"
  status = 301
  force  = true

# Netlify Forms spam filter (optional – if using Netlify Forms instead of Formspree)
# [[redirects]]
#   from  = "/contact"
#   to    = "/#contacto"
#   status = 302
